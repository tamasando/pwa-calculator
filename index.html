<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Magyar nyelvű, offline is működő számológép.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Számológép">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<title>Számológép</title>
<script defer src="./app.js"></script>
</head>
<body>
<main class="shell"><section class="calculator">
<header><div><small>ZSEBALKALMAZÁS</small><h1>Számológép</h1></div><span class="badge">● Offline</span></header>
<div class="screen"><div class="expression" id="expression">&nbsp;</div><output id="result" aria-live="polite">0</output></div>
<div class="keypad" aria-label="Számológép billentyűzet">
<button class="utility" data-action="clear">AC</button><button class="utility" data-action="sign">±</button><button class="utility" data-action="percent">%</button><button class="operator" data-action="operator" data-value="/">÷</button>
<button data-action="digit" data-value="7">7</button><button data-action="digit" data-value="8">8</button><button data-action="digit" data-value="9">9</button><button class="operator" data-action="operator" data-value="*">×</button>
<button data-action="digit" data-value="4">4</button><button data-action="digit" data-value="5">5</button><button data-action="digit" data-value="6">6</button><button class="operator" data-action="operator" data-value="-">−</button>
<button data-action="digit" data-value="1">1</button><button data-action="digit" data-value="2">2</button><button data-action="digit" data-value="3">3</button><button class="operator" data-action="operator" data-value="+">+</button>
<button class="utility" data-action="backspace" aria-label="Törlés">⌫</button><button data-action="digit" data-value="0">0</button><button data-action="decimal">,</button><button class="equals" data-action="equals">=</button>
</div>
<footer><span>Billentyűzettel is használható</span><button id="install-button" hidden>＋ Telepítés</button></footer>
</section></main>
</body></html>
